# Bonding integration rig (FIXPLAN M1.6/M1.8) — nightly, not per-commit:
# the soak is minutes long by design. Red-proof stage first (timing-mode=1
# must crash), then the 15-minute timing-mode=0 soak with fault injection.
name: Bonding rig (nightly)

on:
  schedule:
    - cron: "17 15 * * *"   # nightly ~01:17 AEST
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak seconds (default 900)"
        default: "900"

jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run rig
        env:
          RIG_DURATION: ${{ github.event.inputs.duration || 900 }}
        run: |
          chmod +x test/rig/rig.sh test/rig/*.sh
          test/rig/rig.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f test/rig/docker-compose.yml logs --tail 200 || true
