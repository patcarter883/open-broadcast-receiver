# RTMP sink for the local publish harness.
#
# Single ingest application at rtmp://<host>:1935/live/<stream>, plus an HTTP
# /stat document that reports what nginx-rtmp actually received on it. The
# harness reads <bytes_in> for the stream it published: that is the server-side
# count an output path has to move, and the only count that cannot be faked by
# a sender-side counter.
worker_processes 1;

error_log /dev/stdout info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
        }
    }
}

http {
    access_log /dev/stdout;

    server {
        listen 8080;

        location /stat {
            rtmp_stat all;
        }

        location /healthz {
            return 200 "ok\n";
        }
    }
}
